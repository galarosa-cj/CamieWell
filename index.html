<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the page scale correctly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <!-- App icon shown in browser tab -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Web App Manifest for Mobile & Desktop Installation -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ff758f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CamieWell" />

    <!-- SEO: descriptive page title -->
    <title>CamieWell — Your Daily Wellness Companion</title>

    <!-- SEO: short description shown in Google search results -->
    <meta name="description" content="CamieWell is a cute, offline-first wellness app for tracking food, water, workouts, and daily habits." />

    <!-- Google Fonts: 'Nunito' for body text, 'Pacifico' for the brand name -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Pacifico&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <!--
      #app is the mount point.
      Vite's main.js will inject Bootstrap + our custom CSS,
      then render the page content here.
    -->
    <div id="app"></div>

    <!--
      type="module" tells the browser this is an ES Module.
      Vite intercepts this in dev mode and handles all imports.
    -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
